name: Publish Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/*
      - README.md

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read version from plugin.json
        id: version
        run: echo "prop=$(python -c 'import json;print(json.load(open("plugin.json"))["Version"])')" >> "$GITHUB_OUTPUT"
      - name: Build plugin zip
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt -t ./lib
          zip -r Flow.Launcher.Plugin.MiCompress.zip . -x '*.git*'
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: Flow.Launcher.Plugin.MiCompress.zip
          tag_name: v${{ steps.version.outputs.prop }}
